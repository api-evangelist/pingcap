openapi: 3.2.0
info:
  title: TiDB Cloud Premium Instance API
  description: '*TiDB Cloud API is in beta.*


    This API manages TiDB Cloud Premium instances.'
  version: v1beta2
servers:
- url: https://cloud.tidbapi.com/v1beta2
tags:
- name: TiDB Cloud Premium Instance
  description: Manage the lifecycle and configuration of TiDB Cloud Premium instances, including passwords, CA certificates, and cloud provider information.
paths:
  /tidbs:
    get:
      summary: List TiDB Cloud Premium instances
      description: Lists all TiDB Cloud Premium instances in your organization. You can filter results by service plan, region, name, or ID.
      operationId: TidbService_ListTidbs
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1beta2ListTidbsResponse'
        '400':
          description: A request field is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '401':
          description: The API key cannot be authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '403':
          description: The API key does not have permission to access the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '429':
          description: You have exceeded the rate limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: servicePlan
        description: 'The plan of the service. If specified, only TiDB Cloud Premium instances of the specified plan are returned.


          - `Premium`: [TiDB Cloud Premium](https://docs.pingcap.com/tidbcloud/select-cluster-tier/#tidb-cloud-premium)'
        in: query
        required: false
        schema:
          type: string
          enum:
          - Premium
      - name: regionIds
        description: A list of region IDs. If specified, only TiDB Cloud Premium instances in these regions are returned.
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: name
        description: The display name to filter by. If specified, only TiDB Cloud Premium instances whose display name contains this value are returned.
        in: query
        required: false
        schema:
          type: string
      - name: tags
        description: A list of tags. If specified, only TiDB Cloud Premium instances tagged with any of these values are returned.
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: tidbIds
        description: A list of TiDB Cloud Premium instance IDs. If specified, only the ones matching these IDs are returned.
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: pageSize
        description: The maximum number of TiDB Cloud Premium instances to return. If not specified, at most 10 will be returned. The maximum value is `100`. Values greater than `100` are set to `100`.
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: '10'
      - name: pageToken
        description: 'The pagination token received from a previous [List TiDB Cloud Premium instances](#tag/TiDB-Instance/operation/TidbService_ListTidbs) request. Use this token to retrieve the next page of results.


          **Note**: When paginating, all other parameters must match the original request.'
        in: query
        required: false
        schema:
          type: string
      - name: skip
        description: The number of TiDB Cloud Premium instances to skip before returning results. If the value exceeds the total number of TiDB Cloud Premium instances, the response is `200` with an empty list and no `nextPageToken`.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - TiDB Cloud Premium Instance
      x-code-samples:
      - label: curl
        lang: curl
        source: 'curl --location ''https://cloud.tidbapi.com/v1beta2/tidbs'' \

          --digest --user ''YOUR_PUBLIC_KEY:YOUR_PRIVATE_KEY'' \

          --header ''Accept: application/json'''
    post:
      summary: Create a TiDB Cloud Premium instance
      description: Creates a new TiDB Cloud Premium instance. If the `tidb.cloud/project` label is provided, the instance will be created in the specified project.
      operationId: TidbService_CreateTidb
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nextgenv1beta2Tidb'
        '400':
          description: A request field is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '401':
          description: The API key cannot be authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '403':
          description: The API key does not have permission to access the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '429':
          description: You have exceeded the rate limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: validateOnly
        description: If set to `true`, the request is validated but not executed. Defaults to `false`.
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - TiDB Cloud Premium Instance
      x-code-samples:
      - label: curl
        lang: curl
        source: "curl --location 'https://cloud.tidbapi.com/v1beta2/tidbs' \\\n--digest --user 'YOUR_PUBLIC_KEY:YOUR_PRIVATE_KEY' \\\n--header 'Content-Type: application/json' \\\n--header 'Accept: application/json' \\\n--data '{\n  \"displayName\": \"my-tidb\",\n  \"regionId\": \"aws-us-west-2\",\n  \"maxRcu\": 20000,\n  \"servicePlan\": \"Premium\"\n}'"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/nextgenv1beta2Tidb'
        description: The TiDB Cloud Premium instance to create.
        required: true
  /tidbs/{tidbId}:
    get:
      summary: Get a TiDB Cloud Premium instance
      description: Retrieves details of a specific TiDB Cloud Premium instance.
      operationId: TidbService_GetTidb
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nextgenv1beta2Tidb'
        '400':
          description: A request field is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '401':
          description: The API key cannot be authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '403':
          description: The API key does not have permission to access the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '429':
          description: You have exceeded the rate limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: tidbId
        description: The ID of the TiDB Cloud Premium instance to retrieve.
        in: path
        required: true
        schema:
          type: string
      tags:
      - TiDB Cloud Premium Instance
      x-code-samples:
      - label: curl
        lang: curl
        source: 'curl --location ''https://cloud.tidbapi.com/v1beta2/tidbs/{tidb_id}'' \

          --digest --user ''YOUR_PUBLIC_KEY:YOUR_PRIVATE_KEY'' \

          --header ''Accept: application/json'''
    delete:
      summary: Delete a TiDB Cloud Premium instance
      description: Deletes a TiDB Cloud Premium instance by `tidbId`.
      operationId: TidbService_DeleteTidb
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nextgenv1beta2Tidb'
        '400':
          description: A request field is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '401':
          description: The API key cannot be authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '403':
          description: The API key does not have permission to access the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '429':
          description: You have exceeded the rate limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: tidbId
        description: The ID of the TiDB Cloud Premium instance to delete.
        in: path
        required: true
        schema:
          type: string
      - name: validateOnly
        description: If set to `true`, the request is validated but not executed. Defaults to `false`.
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - TiDB Cloud Premium Instance
      x-code-samples:
      - label: curl
        lang: curl
        source: 'curl --location --request DELETE ''https://cloud.tidbapi.com/v1beta2/tidbs/{tidb_id}'' \

          --digest --user ''YOUR_PUBLIC_KEY:YOUR_PRIVATE_KEY'' \

          --header ''Accept: application/json'''
  /tidbs/{tidb.tidbId}:
    patch:
      summary: Update a TiDB Cloud Premium instance
      description: 'Updates the configuration of a specific TiDB Cloud Premium instance. You can modify the following fields: `displayName` and `maxRcu`.'
      operationId: TidbService_UpdateTidb
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nextgenv1beta2Tidb'
        '400':
          description: A request field is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '401':
          description: The API key cannot be authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '403':
          description: The API key does not have permission to access the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '429':
          description: You have exceeded the rate limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: tidb.tidbId
        description: The ID of the TiDB Cloud Premium instance to update.
        in: path
        required: true
        schema:
          type: string
      - name: validateOnly
        description: If set to `true`, the request is validated but not executed. Defaults to `false`.
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - TiDB Cloud Premium Instance
      x-code-samples:
      - label: curl
        lang: curl
        source: "curl --location --request PATCH 'https://cloud.tidbapi.com/v1beta2/tidbs/{tidb_id}' \\\n--digest --user 'YOUR_PUBLIC_KEY:YOUR_PRIVATE_KEY' \\\n--header 'Content-Type: application/json' \\\n--header 'Accept: application/json' \\\n--data '{\n  \"displayName\": \"my-updated-tidb\",\n  \"maxRcu\": 40000\n}'"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  example: foo-bar
                  description: The user-defined name of the TiDB Cloud Premium instance.
                  maxLength: 64
                  minLength: 4
                  pattern: ^[A-Za-z0-9][-A-Za-z0-9]{2,62}[A-Za-z0-9]$
                minRcu:
                  type: string
                  format: int64
                  description: 'Deprecated: min_rcu is now automatically managed.

                    Any value provided here will be ignored in favor of max(5000, max_rcu / 4).'
                  readOnly: true
                maxRcu:
                  type: string
                  format: int64
                  description: The maximum number of Request Capacity Units (RCUs) for the TiDB Cloud Premium instance.
              title: The TiDB Cloud Premium instance to update.
              required:
              - tidb
        description: The TiDB Cloud Premium instance to update.
        required: true
  /tidbs/{tidbId}:resetRootPassword:
    post:
      summary: Reset the root password of a TiDB Cloud Premium instance
      description: Sets a new password for the TiDB Cloud Premium instance's root user. The new password is not returned in the response for security reasons, so save your password in a secure location.
      operationId: TidbService_ResetRootPassword
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1beta2ResetRootPasswordResponse'
        '400':
          description: A request field is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '401':
          description: The API key cannot be authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '403':
          description: The API key does not have permission to access the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '429':
          description: You have exceeded the rate limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: tidbId
        description: The ID of the TiDB Cloud Premium instance for which to reset the root password.
        in: path
        required: true
        schema:
          type: string
      tags:
      - TiDB Cloud Premium Instance
      x-code-samples:
      - label: curl
        lang: curl
        source: "curl --location 'https://cloud.tidbapi.com/v1beta2/tidbs/{tidb_id}:resetRootPassword' \\\n--digest --user 'YOUR_PUBLIC_KEY:YOUR_PRIVATE_KEY' \\\n--header 'Content-Type: application/json' \\\n--header 'Accept: application/json' \\\n--data '{\n  \"rootPassword\": \"your-new-password\"\n}'"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TidbServiceResetRootPasswordBody'
        required: true
  /tidbs/{tidbId}/cloudProviderInfo:
    get:
      summary: Get cloud provider information for a TiDB Cloud Premium instance
      description: Retrieves the TiDB Cloud account ID and external ID for the underlying cloud infrastructure of a specific TiDB Cloud Premium instance.
      operationId: TidbService_GetCloudProviderInfo
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1beta2CloudProviderInfo'
        '400':
          description: A request field is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '401':
          description: The API key cannot be authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '403':
          description: The API key does not have permission to access the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '429':
          description: You have exceeded the rate limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: tidbId
        description: The ID of the TiDB Cloud Premium instance for which to retrieve cloud provider information.
        in: path
        required: true
        schema:
          type: string
      tags:
      - TiDB Cloud Premium Instance
      x-code-samples:
      - label: curl
        lang: curl
        source: 'curl --location ''https://cloud.tidbapi.com/v1beta2/tidbs/{tidb_id}/cloudProviderInfo'' \

          --digest --user ''YOUR_PUBLIC_KEY:YOUR_PRIVATE_KEY'' \

          --header ''Accept: application/json'''
  /tidbs/{tidbId}/caCertificateUrl:
    get:
      summary: Get the CA certificate download URL for a TiDB Cloud Premium instance
      description: Retrieves the download URL for the CA certificate required to establish TLS (Transport Layer Security) connections to a specific TiDB Cloud Premium instance.
      operationId: TidbService_GetCaCertificateDownloadUrl
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1beta2CaCertificateDownloadUrl'
        '400':
          description: A request field is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '401':
          description: The API key cannot be authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '403':
          description: The API key does not have permission to access the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '429':
          description: You have exceeded the rate limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: tidbId
        description: The ID of the TiDB Cloud Premium instance for which to retrieve the CA certificate.
        in: path
        required: true
        schema:
          type: string
      tags:
      - TiDB Cloud Premium Instance
      x-code-samples:
      - label: curl
        lang: curl
        source: 'curl --location ''https://cloud.tidbapi.com/v1beta2/tidbs/{tidb_id}/caCertificateUrl'' \

          --digest --user ''YOUR_PUBLIC_KEY:YOUR_PRIVATE_KEY'' \

          --header ''Accept: application/json'''
components:
  schemas:
    nextgenv1beta2Tidb:
      type: object
      properties:
        name:
          type: string
          description: The unique identifier for the TiDB Cloud Premium instance, which is generated by the API and follows the format `tidbs/{tidbId}`.
          readOnly: true
        tidbId:
          type: string
          description: The ID of the TiDB Cloud Premium instance.
          readOnly: true
        displayName:
          type: string
          example: foo-bar
          description: The user-defined name of the TiDB Cloud Premium instance.
          maxLength: 64
          minLength: 4
          pattern: ^[A-Za-z0-9][-A-Za-z0-9]{2,62}[A-Za-z0-9]$
        regionId:
          type: string
          description: The unique identifier of the region where the TiDB Cloud Premium instance is deployed, in the format of `{cloud_provider}-{region_code}`. For example, `aws-us-west-2`.
        cloudProvider:
          description: 'The cloud provider where the TiDB Cloud Premium instance is deployed.


            - `"aws"`: Amazon Web Services


            - `"gcp"`: Google Cloud


            - `"azure"`: Microsoft Azure


            - `"alicloud"`: Alibaba Cloud'
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/RegionCloudProvider'
        regionDisplayName:
          type: string
          description: The display name of the region where the TiDB Cloud Premium instance is deployed. For example, `Oregon (us-west-2)`.
          readOnly: true
        state:
          description: The current state of the TiDB Cloud Premium instance.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/v1beta1ClusterState'
        rootPassword:
          type: string
          example: my-shining-password
          description: 'The root password of the TiDB Cloud Premium instance.


            This field supports two input formats:

            - Plaintext password (legacy behavior)

            - RSA-OAEP-SHA256 encrypted payload prefixed with `rsa_oaep_sha256:`


            If the marker prefix is present, the server parses and decrypts the encrypted payload.

            Any parse/decrypt failure returns an explicit parameter error without plaintext fallback.

            If the marker prefix is absent, the value is treated as plaintext for backward compatibility.


            For plaintext input, the password must be between 8 and 64 characters long and can contain letters,

            numbers, and special characters.'
          pattern: ^(rsa_oaep_sha256:.+|.{8,64})$
        minRcu:
          type: string
          format: int64
          description: 'The minimum number of Request Capacity Units (RCUs) for the TiDB Cloud Premium instance.


            This field is read-only and is automatically calculated as `max(5000, maxRcu / 4)`.'
          readOnly: true
        maxRcu:
          type: string
          format: int64
          description: The maximum number of Request Capacity Units (RCUs) for the TiDB Cloud Premium instance.
        servicePlan:
          description: 'The plan of the service.


            - `Premium`: [TiDB Cloud Premium](https://docs.pingcap.com/tidbcloud/select-cluster-tier/#tidb-cloud-premium)'
          allOf:
          - $ref: '#/components/schemas/v1beta1ServicePlan'
        highAvailabilityType:
          description: 'The high availability configuration for the TiDB Cloud Premium instance.

            - `REGIONAL`: high availability across multiple availability zones within a region. This is the only supported mode for TiDB Cloud Premium instances. For more information, see [Regional high availability architecture](https://docs.pingcap.com/tidbcloud/serverless-high-availability/#regional-high-availability-architecture).

            - `ZONAL`: high availability within a single availability zone. This mode is not supported for TiDB Cloud Premium instances and is reserved for other service plans. For more information, see [Zonal high availability architecture](https://docs.pingcap.com/tidbcloud/serverless-high-availability/#zonal-high-availability-architecture).'
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/TidbHighAvailabilityType'
        annotations:
          type: object
          additionalProperties:
            type: string
          description: 'The annotations for the TiDB Cloud Premium instance. The following lists some predefined annotations:

            - `tidb.cloud/has-set-password`: indicates whether the TiDB Cloud Premium instance has a root password set.

            - `tidb.cloud/available-features`: lists available features of the TiDB Cloud Premium instance.'
        labels:
          type: object
          additionalProperties:
            type: string
          description: 'The labels for the TiDB Cloud Premium instance.

            - `tidb.cloud/organization`: the ID of the organization where the TiDB Cloud Premium instance belongs.

            - `tidb.cloud/project`: the ID of the project where the TiDB Cloud Premium instance belongs.'
        creator:
          type: string
          description: The email address or public API key of the user who created the TiDB Cloud Premium instance.
          readOnly: true
        createTime:
          type: string
          format: date-time
          description: The timestamp when the TiDB Cloud Premium instance was created, in the [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: The timestamp when the TiDB Cloud Premium instance was last updated, in the [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
          readOnly: true
        endpoints:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/TidbEndpoint'
          description: The connection endpoints for accessing the TiDB Cloud Premium instance.
          readOnly: true
        dualLayerDataEncryption:
          description: The dual-layer data encryption configuration for the TiDB Cloud Premium instance.
          allOf:
          - $ref: '#/components/schemas/TidbDualLayerDataEncryption'
        tidbVersion:
          type: string
          description: The version of the TiDB instance.
          readOnly: true
        tags:
          type: array
          items:
            type: string
        capacityUpdateTime:
          type: string
          format: date-time
          description: The timestamp when the capacity of the TiDB Cloud Premium instance was last updated, in the [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
          readOnly: true
      required:
      - displayName
      - regionId
      - maxRcu
      - servicePlan
    TidbEndpoint:
      type: object
      properties:
        host:
          type: string
          description: 'The hostname of the endpoint.


            When `connectionType` is `"PRIVATE_ENDPOINT"`, the behavior of the `host` field varies by cloud provider:

            - For AWS, this field is available after the Private Link service is ready.

            - For Google Cloud and Azure, this field is available after you create a private endpoint connection.'
          readOnly: true
        port:
          type: integer
          format: int32
          description: The port number of the endpoint.
          readOnly: true
        connectionType:
          description: 'The connection type of the endpoint.


            - `PUBLIC`: a public endpoint. For more information, see [Network](https://docs.pingcap.com/tidbcloud/connect-to-tidb-instance/#network).


            - `PRIVATE_ENDPOINT`: a private endpoint. For more information, see [Network](https://docs.pingcap.com/tidbcloud/connect-to-tidb-instance/#network).


            - `VPC_PEERING`: a VPC peering endpoint (not yet supported, planned for a future release).'
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/EndpointConnectionType'
        connectionReachability:
          description: The reachability status of the endpoint connection.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/v1beta2ConnectionReachability'
