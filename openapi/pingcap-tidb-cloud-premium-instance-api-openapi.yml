            For Azure, this is the kubelet identity object ID.'
          readOnly: true
      required:
      - tidbId
    v1beta2ResetRootPasswordResponse:
      type: object
    v1beta2CustomerManagedEncryptionKey:
      type: object
      properties:
        name:
          type: string
          description: The unique name of the CMEK, in the format of `cmeks/{cmek_id}`.
          readOnly: true
        customerManagedEncryptionKeyId:
          type: string
          description: The ID of the CMEK.
          readOnly: true
        regionId:
          type: string
          description: The region where the CMEK is located, in the format of `{cloud_provider}-{region_code}`. For example, `aws-us-west-2`.
        cloudProvider:
          description: 'The cloud provider where the CMEK is located.


            - `"aws"`: Amazon Web Services


            - `"gcp"`: Google Cloud (not yet supported, planned for a future release)


            - `"azure"`: Microsoft Azure (not yet supported, planned for a future release)


            - `"alicloud"`: Alibaba Cloud'
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/RegionCloudProvider'
        servicePlan:
          $ref: '#/components/schemas/v1beta1ServicePlan'
        awsKms:
          description: The configuration for AWS KMS.
          allOf:
          - $ref: '#/components/schemas/CustomerManagedEncryptionKeyAwsKms'
        aliyunKms:
