                  type: string
                description: Error details returned with this error.
                title: details
        '401':
          description: The API key cannot be authenticated.
          schema: {}
        '403':
          description: The API key does not have permission to access the resource.
          schema:
            type: object
            properties:
              code:
                type: integer
                format: integer
                description: Error code returned with this error.
                title: code
              message:
                type: string
                description: Error message returned with this error.
                title: message
              details:
                type: array
                items:
                  type: string
                description: Error details returned with this error.
                title: details
        '404':
          description: The requested resource does not exist.
          schema:
            type: object
            properties:
              code:
                type: integer
                format: integer
                description: Error code returned with this error.
                title: code
              message:
                type: string
                description: Error message returned with this error.
                title: message
              details:
                type: array
                items:
                  type: string
                description: Error details returned with this error.
                title: details
        '429':
          description: You have exceed the rate limit.
