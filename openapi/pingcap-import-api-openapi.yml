              title: ImportSpec
              required:
              - source
              - target
            limit_rows_count:
              type: integer
              format: int64
              x-nullable: true
              example: 10
              default: 10
              description: The maximum number of rows to preview for each table.
              maximum: 20
              minimum: 1
          description: PreviewImportDataReq is the request to preview the source data before starting an import task for a cluster.
