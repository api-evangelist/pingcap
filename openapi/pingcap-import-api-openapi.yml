definitions:
  v1beta1ImportFileTypeEnum:
    type: string
    enum:
    - UNSPECIFIED
    - CSV
    - SQL
    - AURORA_SNAPSHOT
    - PARQUET
    default: UNSPECIFIED
    description: "The type of the file.\n\n - UNSPECIFIED: The type of the file is unknown.\n - CSV: CSV type.\n - SQL: SQL type.\n - AURORA_SNAPSHOT: Aurora snapshot type.\n - PARQUET: Parquet type."
  v1beta1S3SourceAccessKey:
    type: object
    properties:
      id:
        type: string
        description: The access key ID for accessing the S3 source.
      secret:
        type: string
        description: The secret access key for accessing the S3 source.
    required:
    - id
    - secret
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          $ref: '#/definitions/protobufAny'
  v1beta1ImportSourceTypeEnum_2:
    type: string
    enum:
    - S3
    - GCS
    - AZURE_BLOB
    - S3_COMPATIBLE
    - OSS
    description: " - S3: S3 source.\n - GCS: gcs source.\n - AZURE_BLOB: azure blob source.\n - S3_COMPATIBLE: S3 compatible source.\n - OSS: OSS source."
  v1beta1GCSSource:
    type: object
    properties:
      uri:
        type: string
        example: gs://bucket-name/path/
        description: The Google Cloud Storage URI of the import source.
      authType:
        example: SERVICE_ACCOUNT_KEY
        description: The authentication method for accessing the Google Cloud Storage source.
        allOf:
        - $ref: '#/definitions/v1beta1ImportGcsAuthTypeEnum'
      serviceAccountKey:
        type: string
        description: The service account key for accessing the Google Cloud Storage source.
    description: The Google Cloud Storage source of the import.
    required:
    - uri
    - authType
  v1beta1DuplicationHandlingForSQLEnum:
    type: string
    enum:
    - UNSPECIFIED
    - REPLACE
    - IGNORE
    - ERROR
    default: UNSPECIFIED
    description: "The duplication handling for SQL.\n\n - UNSPECIFIED: The duplication handling for SQL is unknown.\n - REPLACE: The duplication handling for SQL is replace.\n - IGNORE: The duplication handling for SQL is ignore.\n - ERROR: The duplication handling for SQL is error."
  v1beta1ImportS3AuthTypeEnum_2:
    type: string
    enum:
    - ROLE_ARN
    - ACCESS_KEY
    description: " - ROLE_ARN: The access method is role arn.\n - ACCESS_KEY: The access method is access key."
  v1beta1S3CompatibleSourceAccessKey:
    type: object
    properties:
      id:
        type: string
        description: The access key ID for accessing the S3-compatible storage.
      secret:
        type: string
        description: The secret access key for accessing the S3-compatible storage.
    required:
    - id
    - secret
  v1beta1ImportStateEnum:
    type: string
    enum:
    - UNSPECIFIED
    - PREPARING
    - IMPORTING
    - COMPLETED
    - FAILED
    - CANCELING
    - CANCELED
    default: UNSPECIFIED
    description: "The state of the import.\n\n - UNSPECIFIED: Indicates that the import state is not specified.\n - PREPARING: Indicates that the import is being prepared.\n - IMPORTING: Indicates that the import is in progress.\n - COMPLETED: Indicates that the import is completed successfully.\n - FAILED: Indicates that the import has failed.\n - CANCELING: Indicates that the import is in the process of being canceled.\n - CANCELED: Indicates that the import has been canceled."
  v1beta1ImportAzureBlobAuthTypeEnum_2:
    type: string
    enum:
    - SAS_TOKEN
    description: ' - SAS_TOKEN: The access method is sas token.'
  v1beta1Import:
    type: object
    properties:
      name:
        type: string
        example: clusters/1/imports/1
        description: The name of the import task, in the format of `clusters/{cluster_id}/imports/{import_id}`.
        readOnly: true
      clusterId:
        type: string
        example: '1'
        description: The ID of the target cluster for the import.
        readOnly: true
      totalSize:
        type: string
        format: int64
        example: 0
        description: The total size of the data to be imported, in bytes.
        readOnly: true
      createTime:
        type: string
        format: date-time
        example: '2023-10-01T12:00:00Z'
        description: The timestamp when the import task was created, in the [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
        readOnly: true
      completeTime:
        type: string
        format: date-time
        example: '2023-10-01T12:01:00Z'
        description: The timestamp when the import task was completed, in the [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
        readOnly: true
      state:
        example: COMPLETED
        description: The state of the import task.
        readOnly: true
        allOf:
        - $ref: '#/definitions/v1beta1ImportStateEnum'
      completePercent:
        type: integer
        format: int32
        example: 100
        minimum: 0
        maximum: 100
        description: The percentage of import progress, excluding post-processing.
        readOnly: true
      message:
        type: string
        example: ''
        description: An error message if the import task failed. Otherwise, empty.
        readOnly: true
      creator:
        type: string
        example: test@example.com
        description: The email address of the user who creates the import task.
        readOnly: true
      creationDetails:
        description: The additional details about how the import task is created.
        allOf:
        - $ref: '#/definitions/v1beta1CreationDetails'
      importId:
        type: string
        example: '1'
        description: The unique identifier of the import task.
        readOnly: true
    description: The import.
    required:
    - creationDetails
  v1beta1ImportOSSAuthTypeEnum:
    type: string
    enum:
    - ACCESS_KEY
    description: ' - ACCESS_KEY: The access method is access key.'
  v1beta1ImportGcsAuthTypeEnum_2:
    type: string
    enum:
    - SERVICE_ACCOUNT_KEY
    description: ' - SERVICE_ACCOUNT_KEY: The access method is service account key.'
  v1beta1ImportGcsAuthTypeEnum:
    type: string
    enum:
    - UNSPECIFIED
    - SERVICE_ACCOUNT_KEY
    default: UNSPECIFIED
    description: "The type of the access method.\n\n - UNSPECIFIED: The access method is unknown.\n - SERVICE_ACCOUNT_KEY: The access method is service account key."
  v1beta1GCSSource_2:
    type: object
    properties:
      uri:
        type: string
        description: The Google Cloud Storage URI of the import source.
      authType:
        description: The authentication method for accessing the Google Cloud Storage source.
        allOf:
        - $ref: '#/definitions/v1beta1ImportGcsAuthTypeEnum_2'
      serviceAccountKey:
        type: string
        description: The service account key for accessing the Google Cloud Storage source.
    required:
    - uri
    - authType
  googlerpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
        description: The error code returned with this error.
      message:
        type: string
        description: The error message returned with this error.
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
        description: A list of messages with additional error details.
    description: 'The `Status` type defines a logical error model that is suitable for

      different programming environments, including REST APIs and RPC APIs. It is

      used by [gRPC](https://github.com/grpc). Each `Status` message contains

      three pieces of data: error code, error message, and error details.


      You can find out more about this error model and how to work with it in the

      [API Design Guide](https://cloud.google.com/apis/design/errors).'
  v1beta1ImportS3CompatibleAuthTypeEnum:
    type: string
    enum:
    - ACCESS_KEY
    description: ' - ACCESS_KEY: The access method is access key.'
  S3SourceAccessKey:
    type: object
    properties:
      id:
        type: string
        example: AKIAIOSFODNN7EXAMPLE
        description: The access key ID for accessing the S3 source.
      secret:
        type: string
        example: THESECRETKEY
        description: The secret access key for accessing the S3 source. This field is input-only and not returned in responses.
    description: The access key of the import source.
    required:
    - id
    - secret
  v1beta1ImportAzureBlobAuthTypeEnum:
    type: string
    enum:
    - UNSPECIFIED
    - SAS_TOKEN
    default: UNSPECIFIED
    description: "The type of the access method.\n\n - UNSPECIFIED: The access method is unknown.\n - SAS_TOKEN: The access method is sas token."
  v1beta1OSSSourceAccessKey:
    type: object
    properties:
      id:
        type: string
        description: The AccessKey ID for accessing Alibaba Cloud OSS.
      secret:
        type: string
        description: The AccessKey secret for accessing Alibaba Cloud OSS.
    required:
    - id
    - secret
  v1beta1CSVFormat:
    type: object
    properties:
      separator:
        type: string
        example: ','
        default: ','
        description: The character used to separate values in the CSV file.
      delimiter:
        type: string
        example: '"'
        default: '"'
        description: The character used to enclose string values in the CSV file.
      header:
        type: boolean
        example: true
        default: true
        description: Indicates whether the first row of the CSV file contains column headers.
      notNull:
        type: boolean
        example: false
        default: false
        description: Indicates whether the columns in the CSV file can be NULL.
      nullValue:
        type: string
        example: \N
        default: \N
        description: The string representation of NULL values in the CSV file.
      backslashEscape:
        type: boolean
        example: true
        default: true
        description: Indicates whether to escape backslashes in the CSV file.
      trimLastSeparator:
        type: boolean
        example: false
        default: false
        description: Indicates whether to remove trailing separators from each row in the CSV file.
    description: The format of the CSV file.
  v1beta1Import_2:
    type: object
    properties:
      id:
        type: string
        description: '**Deprecated.** Use `importId` instead. The ID of the import task.'
        readOnly: true
      name:
        type: string
        description: The name of the import task.
        readOnly: true
      clusterId:
        type: string
        description: The ID of the target TiDB Cloud Starter or Essential instance for the import.
        readOnly: true
      totalSize:
        type: string
        format: uint64
        description: The total size of the data to be imported, in bytes.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: The timestamp when the import task was created, in the [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
        readOnly: true
      completeTime:
        type: string
        format: date-time
        x-nullable: true
        description: The timestamp when the import task was completed, in the [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
        readOnly: true
      state:
        description: The state of the import task.
        readOnly: true
        allOf:
        - $ref: '#/definitions/v1beta1ImportStateEnum_2'
      completePercent:
        type: integer
        format: int64
        description: The percentage of import progress, excluding post-processing.
        readOnly: true
      message:
        type: string
        description: An error message if the import task failed. Otherwise, empty.
        readOnly: true
      createdBy:
        type: string
        description: The email address of the user who create the import task.
        readOnly: true
      creationDetails:
        description: The additional details about how the import task is created.
        readOnly: true
        allOf:
        - $ref: '#/definitions/v1beta1CreationDetails_2'
      importId:
        type: string
        description: The ID of the import task.
        readOnly: true
  v1beta1ImportSource_2:
    type: object
    properties:
      type:
        description: The source from which data is imported.
        allOf:
        - $ref: '#/definitions/v1beta1ImportSourceTypeEnum_2'
      s3:
        description: The configuration details for importing from Amazon S3.
        allOf:
        - $ref: '#/definitions/v1beta1S3Source_2'
      gcs:
        description: The configuration details for importing from Google Cloud Storage.
        allOf:
        - $ref: '#/definitions/v1beta1GCSSource_2'
      azureBlob:
        description: The configuration details for importing from Azure Blob Storage.
        allOf:
        - $ref: '#/definitions/v1beta1AzureBlobSource_2'
      s3Compatible:
        description: The configuration details for importing from a S3-compatible storage service.
        allOf:
        - $ref: '#/definitions/v1beta1S3CompatibleSource'
      oss:
        description: The configuration details for importing from Alibaba Cloud Object Storage Service (OSS).
        allOf:
        - $ref: '#/definitions/v1beta1OSSSource'
    required:
    - type
  v1beta1ImportValidationItem:
    type: string
    enum:
    - IMPORT_VALIDATION_ITEM_UNSPECIFIED
    - SOURCE_ACCESS_CHECK
    - TARGET_ACCESS_CHECK
    - FILTER_AND_RULE_CHECK
    - IMPORT_PRECHECK
    - TARGET_TABLE_EMPTY_CHECK
    - ESTIMATE_SIZE
    - IMPORT_DATA_ONLY_CHECK
    default: IMPORT_VALIDATION_ITEM_UNSPECIFIED
    description: "The validation item of the import.\n\n - IMPORT_VALIDATION_ITEM_UNSPECIFIED: The validation item is unspecified.\n - SOURCE_ACCESS_CHECK: The validation item is source access check.\n - TARGET_ACCESS_CHECK: The validation item is target access check.(deprecated)\n - FILTER_AND_RULE_CHECK: The validation item is filter and rule check.(deprecated)\n - IMPORT_PRECHECK: The validation item is import precheck.\n - TARGET_TABLE_EMPTY_CHECK: The validation item is target table empty check.\n - ESTIMATE_SIZE: The validation item is estimate size.(deprecated)\n - IMPORT_DATA_ONLY_CHECK: The validation item is import data only check."
  v1beta1ImportTargetTableInfo:
    type: object
    properties:
      targetTable:
        description: The target table where the data is imported.
        allOf:
        - $ref: '#/definitions/commonTable'
      customFile:
        type: string
        example: s3://mybucket/myfolder/my-data1.csv
        description: The custom file URI to import data into the target table. If not specified, TiDB Cloud Dedicated uses the default naming conventions to match files to tables.
      matchedUri:
        type: string
        description: The actual source file URI that is matched to this table during import processing.
    description: The target table info of the import task.
  v1beta1ImportSourceTypeEnum:
    type: string
    enum:
    - UNSPECIFIED
    - S3
    - GCS
    - AZURE_BLOB
    default: UNSPECIFIED
    description: "The source type of the import.\n\n - UNSPECIFIED: Indicates that the import source is not specified.\n - S3: Indicates that the import source is an AWS S3 resource.\n - GCS: Indicates that the import source is a Google Cloud Storage resource.\n - AZURE_BLOB: Indicates that the import source is an Azure Blob Storage resource."
  v1beta1S3Source:
    type: object
    properties:
      uri:
        type: string
        example: s3://bucket-name/path/
        description: The S3 URI of the import source.
      authType:
        example: ROLE_ARN
        description: The authentication method for accessing the S3 bucket.
        allOf:
        - $ref: '#/definitions/v1beta1ImportS3AuthTypeEnum'
      roleArn:
        type: string
        example: arn:aws:iam::123456789012:role/MyRole
        description: The AWS IAM role ARN used for access. This is required when `authType` is set to `"ROLE_ARN"`.
      accessKey:
        description: The AWS access key credentials used for access. This is required when `authType` is set to `"ACCESS_KEY"`.
        allOf:
        - $ref: '#/definitions/S3SourceAccessKey'
    description: The S3 source of the import.
    required:
    - uri
    - authType
  v1beta1ImportFileTypeEnum_2:
    type: string
    enum:
    - CSV
    - SQL
    - AURORA_SNAPSHOT
    - PARQUET
    description: " - CSV: CSV type.\n - SQL: SQL type.\n - AURORA_SNAPSHOT: Aurora snapshot type.\n - PARQUET: Parquet type."
  commonTable:
    type: object
    properties:
      schema:
        type: string
        example: database_name
        description: The name of the database containing the target table.
      table:
        type: string
        example: table_name
        description: The name of the table within the database.
  v1beta1AzureBlobSource:
    type: object
    properties:
      authType:
        example: SAS_TOKEN
        description: The authentication method for accessing the Azure Blob Storage source.
        allOf:
        - $ref: '#/definitions/v1beta1ImportAzureBlobAuthTypeEnum'
      sasToken:
        type: string
        example: ?sv=2020-08-04&ss=b&srt=sco&sp=rwdlacup&se=2023-10-01T12:00:00Z&st=2023-09-30T12:00:00Z&spr=https&sig=example
        description: The Shared Access Signature (SAS) token for accessing the Azure Blob Storage source. This field is input-only and not returned in responses.
      uri:
        type: string
