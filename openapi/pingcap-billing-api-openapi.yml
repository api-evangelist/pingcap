          type: number
          example: 0
        serviceCosts:
          type: array
          items:
            $ref: '#/components/schemas/forms.BillsServiceCosts_2'
        serviceName:
          description: The name of services provided by TiDB Cloud.
          type: string
          example: TiDB Dedicated
        totalCost:
          description: 'The total amount that the specified organization should pay toward this bill. The value of this field is expressed in cents (100ths of one US Dollar).

            `total_cost` = `running_total` - `discounts` - `credits`.'
          type: number
          example: 0
    forms.BillsOtherName_2:
      type: object
      properties:
        chargeName:
          type: string
          example: Support Plan
