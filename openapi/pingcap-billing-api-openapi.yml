          type: string
          example: '0.00'
    forms.Provider:
      type: object
      properties:
        name:
          description: Name of the cloud provider
          type: string
        regions:
          description: Name of the region
          type: array
          items:
            type: string
    forms.BillsDetail:
      type: object
