      tags:
      - Project
      x-code-samples:
      - lang: curl
        source: "curl --digest \\\n  --user 'YOUR_PUBLIC_KEY:YOUR_PRIVATE_KEY' \\\n  --request POST \\\n  --url https://api.tidbcloud.com/api/v1beta/projects \\\n  --header 'content-type: application/json' \\\n  --data '{\"name\":\"Project0\",\"aws_cmek_enabled\":false}'"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Project0
                  description: The name of the project.
                aws_cmek_enabled:
                  type:
                  - boolean
                  - 'null'
                  example: false
                  default: false
                  description: 'Flag that indicates whether to enable AWS Customer-Managed Encryption Keys.


                    Currently this feature is only available upon request. If you need to try out this feature, contact [support](https://docs.pingcap.com/tidbcloud/tidb-cloud-support).'
              description: CreateProjectReq is the request for creating project.
              title: CreateProjectReq
              required:
