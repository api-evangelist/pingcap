components:
  schemas:
    dedicatedv1beta1PrivateEndpointConnection:
      type: object
      properties:
        name:
          type: string
          example: tidbNodeGroups/1/privateEndpointConnections/1234567890
          description: The name of the private endpoint connection, in the format of `tidbNodeGroups/{tidb_node_group_id}/privateEndpointConnections/{private_endpoint_connection_id}`.
          readOnly: true
        tidbNodeGroupId:
          type: string
          example: '1'
          description: The ID of the TiDB node group to which the private endpoint connection belongs.
        privateEndpointConnectionId:
          type: string
          example: '1234567890'
          description: The unique ID of the private endpoint connection.
          readOnly: true
        clusterId:
          type: string
          example: '1'
          description: The ID of the cluster to which the private endpoint connection belongs.
          readOnly: true
        clusterDisplayName:
          type: string
          example: my-cluster
          description: The display name of the cluster to which the private endpoint connection belongs.
          readOnly: true
        labels:
          type: object
          example:
            tidb.cloud/project: '1'
          additionalProperties:
            type: string
          description: The labels of the private link connection, including the mandatory `tidb.cloud/project` label identifying the project it belongs to. Each label consists of a string key and a string value.
          readOnly: true
        endpointId:
          type: string
          example: vpce-0a1b2c3d4e5f6g7h8
          description: 'The endpoint ID of the private link connection.


            - AWS: the VPC endpoint ID for [AWS PrivateLink

            ](https://aws.amazon.com/privatelink/).


            - Google Cloud: the endpoint ID for [Private Service Connect](https://cloud.google.com/vpc/docs/private-service-connect).


            - Azure: the resource ID for [Azure Private Link](https://learn.microsoft.com/en-us/azure/private-link/private-link-overview).'
        privateIpAddress:
          type:
          - string
          - 'null'
          description: (Azure only) The private IP address of the private endpoint in your virtual network. TiDB Cloud automatically creates a public DNS record that resolves to this IP address, enabling you to connect using the DNS name.
        endpointState:
          example: ACTIVE
          description: 'The state of the private endpoint connection.


            - `"PENDING"`: TiDB Cloud is asynchronously accepting the endpoint connection.


            - `"ACTIVE"`: the private endpoint connection is ready to use.


            - `"DELETING"`: the private endpoint connection is being deleted.


            - `"FAILED"`: the private endpoint connection has failed.

            - `"DISCOVERED"`: the endpoint is created in your VPC but not registered with TiDB Cloud.'
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/dedicatedv1beta1PrivateEndpointConnectionEndpointState'
        message:
          type: string
          example: ''
          description: The detailed message when the `endpointState` field is `"FAILED"`.
          readOnly: true
        regionId:
          type: string
          example: aws-us-east-1
          description: The ID of the region where the private endpoint connection is located, in the format of `{cloud_provider}-{region_code}`. For example, `aws-us-east-1`.
          readOnly: true
        regionDisplayName:
          type: string
          example: N. Virginia (us-east-1)
          description: The display name of the region where the private endpoint connection is located. For example, `N. Virginia (us-east-1)`.
          readOnly: true
        cloudProvider:
          example: aws
          description: The cloud provider where the private endpoint connection is located.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/v1beta1RegionCloudProvider'
        privateLinkServiceName:
          type: string
          example: com.amazonaws.vpce.us-east-1.vpce-svc-1234567890
          description: The name of the private link service that the private endpoint connection is connected to.
          readOnly: true
        privateLinkServiceState:
          example: ACTIVE
          description: The state of the private link service that the private endpoint connection is connected to.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/dedicatedv1beta1PrivateLinkServiceState'
        tidbNodeGroupDisplayName:
          type: string
          example: DefaultGroup
          description: The display name of the TiDB node group that the private endpoint connection is connected to.
          readOnly: true
        accountId:
          type:
          - string
          - 'null'
          description: (Google Cloud only) The project name used to identify the Google Cloud project that the private service connection belongs to.
          readOnly: true
        host:
          type: string
          example: privatelink-1234567890.abcdefg.clusters.tidb-cloud.com
          description: The hostname for accessing the TiDB cluster through the private endpoint connection.
          readOnly: true
        port:
          type: integer
          format: int32
          example: 4000
          description: The port used to connect to the TiDB cluster through the private endpoint connection.
          readOnly: true
      required:
      - tidbNodeGroupId
      - endpointId
    dedicatedv1beta1PrivateLinkService:
      type: object
      properties:
        name:
          type: string
          example: tidbNodeGroups/1/privateLinkService
          description: The name of the private link service.
        tidbNodeGroupId:
          type: string
          example: '1'
          description: The ID of the TiDB node group to which the private link service belongs.
        serviceName:
          type: string
          example: com.amazonaws.vpce.us-east-1.vpce-svc-1234567890
          description: 'The service name of the private link service, which varies by cloud provider:


            - AWS: the service name of the private link service.


            - Google Cloud: the resource name of the service attachment.


            - Azure: the resource ID of the private link service.'
        serviceDnsName:
          type: string
          example: privatelink-1234567890.muznnz1umf3p.clusters.tidb-cloud.com
          description: 'The DNS name of the private link service, which varies by cloud provider:


            - AWS: the fully qualified domain name (FQDN) shared across all private endpoints, regardless of VPC location.


            - Google Cloud: the zone name (suffix of the FQDN) shared across all private endpoints in a single VPC network. The FQDN format is `<endpoint_name>.<service_dns_name>`.


            - Azure: the zone name shared across public internet. The FQDN format is `<endpoint_name>-<random_hash>.<service_dns_name>`.'
        availableZones:
          type: array
          example:
          - use1-az1
          - use1-az4
          - use1-az6
          items:
            type: string
          description: (AWS only) The availability zones where the private link service is available. For more information, see [`DescribeVpcEndpointServices`](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_DescribeVpcEndpointServices.html).
        state:
          example: ACTIVE
          description: 'The state of the private link service.


            - `"CREATING"`: the private link service is being created.


            - `"ACTIVE"`: the private link service is ready to use.


            - `"DELETING"`: the private link service is being deleted.'
          allOf:
          - $ref: '#/components/schemas/dedicatedv1beta1PrivateLinkServiceState'
        regionId:
          type: string
          example: aws-us-east-1
          description: The ID of the region where the private link service is located, in the format of `{cloud_provider}-{region_code}`. For example, `aws-us-east-1`.
        regionDisplayName:
          type: string
          example: N. Virginia (us-east-1)
          description: The display name of the region where the private link service is located. For example, `N. Virginia (us-east-1)`.
        cloudProvider:
          example: aws
          description: 'The cloud provider where the private link service is located.


            - `"aws"`: Amazon Web Services


            - `"gcp"`: Google Cloud


            - `"azure"`: Microsoft Azure


            - `"alicloud"`: Alibaba Cloud'
          allOf:
          - $ref: '#/components/schemas/v1beta1RegionCloudProvider'
      description: All fields are output only.
    googlerpcStatus:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: The error code returned with this error.
        message:
          type: string
          description: The error message returned with this error.
        details:
          type: array
          items:
            $ref: '#/components/schemas/protobufAny'
          description: A list of messages with additional error details.
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
    protobufAny:
      type: object
      properties:
        '@type':
          type: string
          description: A URL or resource name that uniquely identifies the type of the serialized protocol buffer message.
      additionalProperties: {}
      description: "`Any` contains an arbitrary serialized protocol buffer message along with a\nURL that describes the type of the serialized message.\n\nProtobuf library provides support to pack/unpack Any values in the form\nof utility functions or additional generated methods of the Any type.\n\nExample 1: Pack and unpack a message in C++.\n\n    Foo foo = ...;\n    Any any;\n    any.PackFrom(foo);\n    ...\n    if (any.UnpackTo(&foo)) {\n      ...\n    }\n\nExample 2: Pack and unpack a message in Java.\n\n    Foo foo = ...;\n    Any any = Any.pack(foo);\n    ...\n    if (any.is(Foo.class)) {\n      foo = any.unpack(Foo.class);\n    }\n    // or ...\n    if (any.isSameTypeAs(Foo.getDefaultInstance())) {\n      foo = any.unpack(Foo.getDefaultInstance());\n    }\n\n Example 3: Pack and unpack a message in Python.\n\n    foo = Foo(...)\n    any = Any()\n    any.Pack(foo)\n    ...\n    if any.Is(Foo.DESCRIPTOR):\n      any.Unpack(foo)\n      ...\n\n Example 4: Pack and unpack a message in Go\n\n     foo := &pb.Foo{...}\n     any, err := anypb.New(foo)\n     if err != nil {\n       ...\n     }\n     ...\n     foo := &pb.Foo{}\n     if err := any.UnmarshalTo(foo); err != nil {\n       ...\n     }\n\nThe pack methods provided by protobuf library will by default use\n'type.googleapis.com/full.type.name' as the type URL and the unpack\nmethods only use the fully qualified type name after the last '/'\nin the type URL, for example \"foo.bar.com/x/y.z\" will yield type\nname \"y.z\".\n\nJSON\n====\nThe JSON representation of an `Any` value uses the regular\nrepresentation of the deserialized, embedded message, with an\nadditional field `@type` which contains the type URL. Example:\n\n    package google.profile;\n    message Person {\n      string first_name = 1;\n      string last_name = 2;\n    }\n\n    {\n      \"@type\": \"type.googleapis.com/google.profile.Person\",\n      \"firstName\": <string>,\n      \"lastName\": <string>\n    }\n\nIf the embedded message type is well-known and has a custom JSON\nrepresentation, that representation will be embedded adding a field\n`value` which holds the custom JSON in addition to the `@type`\nfield. Example (for message [google.protobuf.Duration][]):\n\n    {\n      \"@type\": \"type.googleapis.com/google.protobuf.Duration\",\n      \"value\": \"1.212s\"\n    }"
    dedicatedv1beta1ListPrivateEndpointConnectionsResponse:
      type: object
      properties:
        privateEndpointConnections:
          type: array
          items:
            $ref: '#/components/schemas/dedicatedv1beta1PrivateEndpointConnection'
          description: A list of private endpoint connections that match the query.
        totalSize:
          type: integer
          format: int32
          example: 1
          description: The total number of private link connections that match the query.
        nextPageToken:
          type: string
          example: next_page_token
          description: The token to retrieve the next page of results. Use this value as the `pageToken` parameter in the next request. This field is empty when there are no more pages.
    dedicatedv1beta1PrivateEndpointConnectionEndpointState:
      type: string
      enum:
      - PENDING
      - ACTIVE
      - DELETING
      - FAILED
      - DISCOVERED
      description: 'The state of the private endpoint connection.


        - `"PENDING"`: TiDB Cloud is asynchronously accepting the endpoint connection.


        - `"ACTIVE"`: the private endpoint connection is ready to use.


        - `"DELETING"`: the private endpoint connection is being deleted.


        - `"FAILED"`: the private endpoint connection has failed.

        - `"DISCOVERED"`: the endpoint is created in your VPC but not registered with TiDB Cloud.'
    v1beta1RegionCloudProvider:
      type: string
      enum:
      - aws
      - gcp
      - azure
      - alicloud
      description: "Enum of cloud provider names.\n\n - aws: Amazon Web Services.\n - gcp: Google Cloud Platform.\n - azure: Microsoft Azure.\n - alicloud: Alibaba Cloud."
    dedicatedv1beta1PrivateLinkServiceState:
      type: string
      enum:
      - CREATING
      - ACTIVE
      - DELETING
      description: " - CREATING: The private link service is being created.\n - ACTIVE: The private link service is active and ready for use.\n - DELETING: The private link service is being deleted."
