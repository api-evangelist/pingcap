      parameters:
      - name: project_id
        description: The ID of the project. You can get the project ID from the response of [List all accessible projects.](#tag/Project/operation/ListProjects).
        in: path
        required: true
        schema:
          type: string
          format: uint64
      tags:
      - Restore
      x-code-samples:
      - lang: curl
        source: "curl --digest \\\n  --user 'YOUR_PUBLIC_KEY:YOUR_PRIVATE_KEY' \\\n  --request POST \\\n  --url https://api.tidbcloud.com/api/v1beta/projects/{project_id}/restores \\\n  --header 'content-type: application/json' \\\n  --data '{\"backup_id\":\"1\",\"name\":\"Cluster0\",\"config\":{\"root_password\":\"password_example\",\"port\":4000,\"components\":{\"tidb\":{\"node_size\":\"8C16G\",\"node_quantity\":2},\"tikv\":{\"node_size\":\"8C32G\",\"storage_size_gib\":1024,\"node_quantity\":3}},\"ip_access_list\":[{\"cidr\":\"8.8.8.8/32\",\"description\":\"My Current IP Address\"}]}}'"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                backup_id:
                  type: string
                  format: uint64
                  example: '1'
                  description: The ID of the backup.
                name:
                  type: string
                  example: Cluster0
                  description: 'The name of the restored cluster. The restored cluster is the new cluster your backup data is restored to.


                    - The name must be 4-64 characters that only contain numbers, letters, and hyphens. The first and last character must be a letter or number.

                    - This must be different from the name of the existing cluster.'
                  pattern: ^[A-Za-z0-9][-A-Za-z0-9]{2,62}[A-Za-z0-9]$
                config:
                  description: The configuration of the cluster.
                  type: object
                  properties:
                    root_password:
                      type: string
                      example: password_example
                      description: The root password to access the cluster. It must be 8-64 characters.
                      maxLength: 64
                      minLength: 8
                    port:
                      type: integer
                      format: int32
                      example: 4000
                      default: 4000
                      description: 'The TiDB port for connection. The port must be in the range of 1024-65535 except 10080.


                        **Limitations**:

                        - For a TiDB Cloud Starter instance, only port `4000` is available.'
                      maximum: 65535
                      minimum: 1024
                    components:
                      example:
                        tidb:
                          node_size: 8C16G
                          node_quantity: 2
                        tikv:
                          node_size: 8C32G
                          storage_size_gib: 1024
                          node_quantity: 3
                      description: 'The components of the cluster.


                        **Limitations**:

                        - For a TiDB Cloud Dedicated cluster, the `components` parameter is **required**.

                        - For a TiDB Cloud Starter instance, the `components` value is **ignored**. Setting this configuration does not have any effects.'
                      type: object
                      properties:
                        tidb:
                          description: The TiDB component of the cluster.
                          type: object
                          properties:
                            node_size:
                              type: string
                              example: 8C16G
                              description: 'The size of the TiDB component in the cluster. You can get the available node size of each region from the response of [List the cloud providers, regions and available specifications](#tag/Cluster/operation/ListProviderRegions).


                                **Additional combination rules**:

                                - If the vCPUs of TiDB or TiKV component is 4, then their vCPUs need to be the same.

                                - If the vCPUs of TiDB or TiKV component is 4, then the cluster does not support TiFlash.'
                            node_quantity:
                              type: integer
                              format: int32
                              example: 2
                              description: 'The number of nodes in the cluster. You can get the minimum and step of a node quantity from the response of [List the cloud providers, regions and available specifications](#tag/Cluster/operation/ListProviderRegions).

                                '
                          required:
                          - node_size
                          - node_quantity
                        tikv:
                          description: The TiKV component of the cluster.
                          type: object
                          properties:
                            node_size:
                              type: string
                              example: 8C64G
                              description: 'The size of the TiKV component in the cluster. You can get the available node size of each region from the response of [List the cloud providers, regions and available specifications](#tag/Cluster/operation/ListProviderRegions).


                                **Additional combination rules**:

                                - If the vCPUs of TiDB or TiKV component is 4, then their vCPUs need to be the same.

                                - If the vCPUs of TiDB or TiKV component is 4, then the cluster does not support TiFlash.'
                            storage_size_gib:
                              type: integer
                              format: int32
                              example: 1024
                              description: The storage size of a node in the cluster. You can get the minimum and maximum of storage size from the response of [List the cloud providers, regions and available specifications](#tag/Cluster/operation/ListProviderRegions).
                            node_quantity:
                              type: integer
                              format: int32
                              example: 3
                              description: 'The number of nodes in the cluster. You can get the minimum and step of a node quantity from the response of [List the cloud providers, regions and available specifications](#tag/Cluster/operation/ListProviderRegions).


                                **Limitations**:

                                - The `node_quantity` of TiKV must be a multiple of 3.'
                          required:
                          - node_size
                          - storage_size_gib
                          - node_quantity
                        tiflash:
                          description: The TiFlash component of the cluster.
                          type: object
                          properties:
                            node_size:
                              type: string
                              example: 8C64G
                              description: 'The size of the TiFlash component in the cluster. You can get the available node size of each region from the response of [List the cloud providers, regions and available specifications](#tag/Cluster/operation/ListProviderRegions).


                                **Additional combination rules**:

                                - If the vCPUs of TiDB or TiKV component is 4, then their vCPUs need to be the same.

                                - If the vCPUs of TiDB or TiKV component is 4, then the cluster does not support TiFlash.'
                            storage_size_gib:
                              type: integer
                              format: int32
                              example: 1024
                              description: 'The storage size of a node in the cluster. You can get the minimum and maximum of storage size from the response of [List the cloud providers, regions and available specifications](#tag/Cluster/operation/ListProviderRegions).

                                '
                            node_quantity:
                              type: integer
                              format: int32
                              example: 1
                              description: The number of nodes in the cluster. You can get the minimum and step of a node quantity from the response of [List the cloud providers, regions and available specifications](#tag/Cluster/operation/ListProviderRegions).
                          required:
                          - node_size
                          - storage_size_gib
                          - node_quantity
                      required:
                      - tidb
                      - tikv
                    ip_access_list:
                      type: array
                      items:
                        type: object
                        properties:
                          cidr:
                            type: string
                            example: 8.8.8.8/32
                            description: The IP address or CIDR range that you want to add to the cluster's IP access list.
                          description:
                            type: string
                            example: My Current IP Address
                            description: Description that explains the purpose of the entry.
                        required:
                        - cidr
                      description: A list of IP addresses and Classless Inter-Domain Routing (CIDR) addresses that are allowed to access the TiDB Cloud cluster via [standard connection](https://docs.pingcap.com/tidbcloud/connect-to-tidb-cluster#connect-via-standard-connection).
                  required:
                  - root_password
              description: CreateRestoreReq is the request for restoring backup to a new cluster.
              title: CreateRestoreReq
              required:
              - backup_id
              - name
              - cluster_spec
        required: true
  /api/v1beta/projects/{project_id}/restores/{restore_id}:
