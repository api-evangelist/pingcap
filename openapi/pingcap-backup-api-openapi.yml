openapi: 3.2.0
info:
  title: TiDB Cloud Backup API
  description: '*TiDB Cloud API is in beta.*


    # Overview


    The TiDB Cloud API is a REST interface that provides you with programmatic access to manage administrative objects within TiDB Cloud.'
  version: v1-beta
  x-logo:
    url: https://download.pingcap.com/tidbcloud-logo-for-api-docs.png
    altText: TiDB Cloud Logo
    href: https://docs.pingcap.com/tidbcloud/
servers:
- url: https://api.tidbcloud.com
tags:
- name: Backup
  description: 'Create, get, modify, and delete backups for TiDB clusters.


    For TiDB Cloud Starter instances, you cannot create or manage backups via API. You can use Dumpling to export your data as backups.'
paths:
  /api/v1beta/projects/{project_id}/clusters/{cluster_id}/backups:
    get:
      summary: List all backups for a cluster
      description: For TiDB Cloud Starter instances, you cannot manage backups via API. You can use Dumpling to export your data as backups.
      operationId: ListBackUpOfCluster
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uint64
                          example: '1'
                          description: The ID of the backup. It is generated by TiDB Cloud.
                        name:
                          type: string
                          example: backup-1
                          description: The name of the backup.
                        description:
                          type: string
                          example: backup for cluster upgrade in 2022/06/07
                          description: The description of the backup. It is specified by the user when taking a manual type backup. It helps you add additional information to the backup.
                        type:
                          example: MANUAL
                          description: The type of backup. TiDB Cloud only supports manual and auto backup. For more information, see [TiDB Cloud Documentation](https://docs.pingcap.com/tidbcloud/backup-and-restore#backup).
                          type: string
                          enum:
                          - MANUAL
                          - AUTO
                        create_timestamp:
                          type: string
                          format: date-time
                          example: '2020-01-01T00:00:00Z'
                          description: The creation time of the backup in UTC. The time format follows the [ISO8601](http://en.wikipedia.org/wiki/ISO_8601) standard, which is `YYYY-MM-DD` (year-month-day) + T +`HH:MM:SS` (hour-minutes-seconds) + Z. For example, `2020-01-01T00:00:00Z`.
                        size:
                          type: string
                          format: uint64
                          example: '102400'
                          description: The bytes of the backup.
                        status:
                          example: SUCCESS
                          description: The status of backup.
                          type: string
                          enum:
                          - PENDING
                          - RUNNING
                          - FAILED
                          - SUCCESS
                      description: The item of backup list.
                      title: ListBackupItem
                    description: The items of all backups.
                  total:
                    type: integer
                    format: int64
                    example: 10
                    description: The total number of backups in the project.
                description: The response for listing backups of a cluster.
                title: ListBackupOfClusterResp
        '400':
          description: A request field is invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: integer
                    description: Error code returned with this error.
                    title: code
                  message:
                    type: string
                    description: Error message returned with this error.
                    title: message
                  details:
                    type: array
                    items:
                      type: string
                    description: Error details returned with this error.
                    title: details
        '401':
          description: The API key cannot be authenticated.
          content:
            application/json:
              schema: {}
        '403':
          description: The API key does not have permission to access the resource.
          content:
