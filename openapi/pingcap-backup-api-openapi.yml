      parameters:
      - name: project_id
        description: The ID of your project. You can get the project ID from the response of [List all accessible projects.](#tag/Project/operation/ListProjects).
        in: path
        required: true
        schema:
          type: string
          format: uint64
      - name: cluster_id
        description: The ID of your cluster that you want to take a manual backup. You can get the cluster ID from the response of [Get all clusters in a project](#tag/Cluster/operation/ListClustersOfProject).
        in: path
        required: true
