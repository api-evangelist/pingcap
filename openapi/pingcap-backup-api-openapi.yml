      x-code-samples:
      - lang: curl
        source: "curl --digest \\\n  --user 'YOUR_PUBLIC_KEY:YOUR_PRIVATE_KEY' \\\n  --request POST \\\n  --url https://api.tidbcloud.com/api/v1beta/projects/{project_id}/clusters/{cluster_id}/backups \\\n  --header 'content-type: application/json' \\\n  --data '{\"name\":\"backup-1\",\"description\":\"backup-1\"}'"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: backup-1
                  description: Specify the name for a manual backup. It is recommended that you use a unique name, so that it is easy to distinguish the backup when you query the backups.
                description:
                  type:
                  - string
                  - 'null'
                  example: backup-1
                  description: The description of the backup. It helps you add additional information to the backup. Allows up to 256 characters.
              description: This request for creating a MANUAL type backup.
              title: CreateBackupReq
              required:
              - name
        required: true
