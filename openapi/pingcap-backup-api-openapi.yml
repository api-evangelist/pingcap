        required: true
        schema:
          type: string
          format: uint64
      - name: cluster_id
        description: The ID of your cluster. You can get the cluster ID from the response of [Get all clusters in a project](#tag/Cluster/operation/ListClustersOfProject).
        in: path
        required: true
        schema:
          type: string
          format: uint64
      - name: page
        description: The number of pages.
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: page_size
        description: The size of a page.
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
