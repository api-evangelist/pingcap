  /api/v1/cluster/info:
    servers:
    - url: https://you.domain.com/
    get:
      tags:
      - Cluster
      summary: get cluster info such as cluster id
      operationId: DMAPIGetClusterInfo
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetClusterInfoResponse'
    put:
      tags:
      - Cluster
      summary: update cluster info.
      operationId: DMAPIUpdateClusterInfo
      requestBody:
        description: request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterTopology'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetClusterInfoResponse'
  /api/v1/cluster/masters:
    servers:
    - url: https://you.domain.com/
    get:
      tags:
      - Cluster
      summary: get cluster master node list
      operationId: DMAPIGetClusterMasterList
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetClusterMasterListResponse'
        '400':
          description: failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithMessage'
