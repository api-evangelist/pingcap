    servers:
    - url: https://you.domain.com/
    delete:
      tags:
      - Cluster
      summary: offline master node
      operationId: DMAPIOfflineMasterNode
      parameters:
      - name: master-name
        in: path
        description: master node name
        required: true
        schema:
          type: string
          example: master1
      responses:
        '204':
