components:
  schemas:
    PrometheusTopology:
      type: object
      properties:
        host:
          type: string
          example: 127.0.0.1
        port:
          type: integer
          example: 9090
      required:
      - host
      - port
    AlertManagerTopology:
      type: object
      properties:
        host:
          type: string
          example: 127.0.0.1
        port:
          type: integer
          example: 9093
      required:
      - host
      - port
    ClusterWorker:
      type: object
      properties:
        name:
          type: string
          example: worker1
        addr:
          type: string
          example: 127.0.0.1:8261
          description: address of the current master node
        bound_stage:
          type: string
          example: bound
          description: bound stage of this worker node
        bound_source_name:
          type: string
          example: mysql-01
          description: source name bound to this worker node
      required:
      - name
      - addr
      - bound_stage
      - bound_source_name
    GrafanaTopology:
      type: object
      properties:
        host:
          type: string
          example: 127.0.0.1
        port:
          type: integer
          example: 3000
      required:
      - host
      - port
    MasterTopology:
      type: object
      properties:
        name:
          type: string
          example: master
        host:
          type: string
          example: 127.0.0.1
        port:
          type: integer
          example: 8261
      required:
      - name
      - host
      - port
    ErrorWithMessage:
      description: operation error
      type: object
      properties:
        error_msg:
          type: string
          description: error message
        error_code:
          type: integer
          description: error code
      required:
      - error_msg
      - error_code
    GetClusterWorkerListResponse:
      type: object
      properties:
        total:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClusterWorker'
      required:
      - total
      - data
    WorkerTopology:
      type: object
      properties:
        name:
          type: string
          example: worker1
        host:
          type: string
          example: 127.0.0.1
        port:
          type: integer
          example: 8261
      required:
      - name
      - host
      - port
    GetClusterMasterListResponse:
      type: object
      properties:
        total:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClusterMaster'
      required:
      - total
      - data
    ClusterTopology:
      type: object
      properties:
        master_topology_list:
          type: array
          items:
            $ref: '#/components/schemas/MasterTopology'
        worker_topology_list:
          type: array
          items:
            $ref: '#/components/schemas/WorkerTopology'
        grafana_topology:
          $ref: '#/components/schemas/GrafanaTopology'
        prometheus_topology:
          $ref: '#/components/schemas/PrometheusTopology'
        alert_manager_topology:
          $ref: '#/components/schemas/AlertManagerTopology'
    GetClusterInfoResponse:
      type: object
      properties:
        cluster_id:
          type: integer
          format: uint64
          description: cluster id
        topology:
          $ref: '#/components/schemas/ClusterTopology'
      required:
      - cluster_id
    ClusterMaster:
      type: object
      properties:
        name:
          type: string
          example: master1
        alive:
          type: boolean
          example: true
          description: online status of this master
        leader:
          type: boolean
          example: true
          description: is this master the leader
        addr:
          type: string
          example: 127.0.0.1:8261
          description: address of the current master node
      required:
      - name
      - alive
      - leader
      - addr
definitions:
  dedicatedv1beta1ComponentType:
    type: string
    enum:
    - TIKV
    - TIDB
    - TIFLASH
    - PD
  googlerpcStatus_2:
    type: object
    properties:
      code:
        type: integer
        format: int32
        description: The error code returned with this error.
      message:
        type: string
        description: The error message returned with this error.
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
        description: A list of messages with additional error details.
    description: 'The `Status` type defines a logical error model that is suitable for

      different programming environments, including REST APIs and RPC APIs. It is

      used by [gRPC](https://github.com/grpc). Each `Status` message contains

      three pieces of data: error code, error message, and error details.


      You can find out more about this error model and how to work with it in the

      [API Design Guide](https://cloud.google.com/apis/design/errors).'
  commonv1beta1ServicePlan:
    type: string
    enum:
    - Starter
    - Essential
  v1beta1ClusterEndpoints:
    type: object
    properties:
      public:
        description: The public endpoint configuration for connecting to the TiDB Cloud Starter or Essential instance. For more information, see [Network](https://docs.pingcap.com/tidbcloud/connect-to-tidb-cluster-serverless/#network).
        allOf:
        - $ref: '#/definitions/v1beta1ClusterEndpointsPublic'
      private:
        description: The private endpoint for securely connecting to the TiDB Cloud Starter or Essential instance. For more information, see [Network](https://docs.pingcap.com/tidbcloud/connect-to-tidb-cluster-serverless/#network).
        readOnly: true
        allOf:
        - $ref: '#/definitions/v1beta1ClusterEndpointsPrivate'
    description: Message for endpoint information for connecting to a TiDB Cloud Starter or Essential instance.
  ShowNodeQuotaResponseComponentQuota:
    type: object
    properties:
      componentType:
        description: 'The component type. The value options are:


          - `TIDB`: [TiDB node](https://docs.pingcap.com/tidbcloud/tidb-cloud-glossary/#tidb-node).


          - `TIKV`: [TiKV node](https://docs.pingcap.com/tidbcloud/tidb-cloud-glossary/#tikv-node).


          - `TIFLASH`: [TiFlash node](https://docs.pingcap.com/tidbcloud/tidb-cloud-glossary/#tiflash-node).'
        allOf:
        - $ref: '#/definitions/dedicatedv1beta1ComponentType'
      quota:
        type: integer
        format: int32
        description: The maximum number of nodes allowed for this component type.
  v1beta1RegionCloudProvider:
    type: string
    enum:
    - aws
    - gcp
    - azure
    - alicloud
    description: "Enum of cloud provider names.\n\n - aws: Amazon Web Services.\n - gcp: Google Cloud Platform.\n - azure: Microsoft Azure.\n - alicloud: Alibaba Cloud."
  PrivateALICLOUD:
    type: object
    properties:
      serviceName:
        type: string
        description: The Alibaba Cloud service name for private access.
        readOnly: true
      availabilityZone:
        type: array
        items:
          type: string
        description: A list of availability zones where the service is available.
        readOnly: true
    description: The [Alibaba Cloud PrivateLink](https://www.alibabacloud.com/help/en/privatelink/product-overview/what-is-a-private-network-connection) configuration for private access.
  ClusterSpendingLimit:
    type: object
    properties:
      monthly:
        type: integer
        format: int32
        description: The maximum spending limit for the TiDB Cloud Starter instance per month, in USD cents.
    description: Message for spending limit configuration.
  serverlessv1beta1ClusterHighAvailabilityType:
    type: string
    enum:
    - ZONAL
    - REGIONAL
    description: 'The high availability configuration for the cluster.


      - `ZONAL`: high availability within a single availability zone. For more information, see [Zonal high availability architecture](https://docs.pingcap.com/tidbcloud/serverless-high-availability/#zonal-high-availability-architecture).

      - `REGIONAL`: high availability across multiple availability zones within a region. For more information, see [Regional high availability architecture](https://docs.pingcap.com/tidbcloud/serverless-high-availability/#regional-high-availability-architecture).'
  v1beta1ClusterEndpointsPrivateAWS:
    type: object
    properties:
      serviceName:
        type: string
        description: The AWS service name for private access.
        readOnly: true
      availabilityZone:
        type: array
        items:
          type: string
        description: A list of availability zones where the service is available.
