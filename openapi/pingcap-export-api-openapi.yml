      - uri
      - authType
    ExportOptionsFilterTable:
      type: object
      properties:
        patterns:
          type: array
          items:
            type: string
          description: A list of [table-filter](https://docs.pingcap.com/tidb/stable/table-filter/#syntax) patterns.
        where:
          type: string
          description: Filters the exported tables with the `WHERE` condition.
    v1beta1ExportTarget:
      type: object
      properties:
        type:
          description: The export target.
          allOf:
          - $ref: '#/components/schemas/v1beta1ExportTargetTypeEnum'
        s3:
          description: The configuration details for exporting data to Amazon S3. This is required when `type` is `S3`.
          allOf:
          - $ref: '#/components/schemas/v1beta1S3Target'
        gcs:
          description: The configuration details for exporting data to Google Cloud Storage. This is required when `type` is `GCS`.
          allOf:
          - $ref: '#/components/schemas/v1beta1GCSTarget'
        azureBlob:
          description: The configuration details for exporting data to Azure Blob Storage. This is required when `type` is `AZURE_BLOB`.
          allOf:
          - $ref: '#/components/schemas/v1beta1AzureBlobTarget'
        oss:
          description: The configuration details for exporting data to Alibaba Cloud Object Storage Service (OSS). This is required when `type` is `OSS`.
          allOf:
          - $ref: '#/components/schemas/v1beta1OSSTarget'
    v1beta1ExportAzureBlobAuthTypeEnum:
      type: string
      enum:
      - SAS_TOKEN
      description: ' - SAS_TOKEN: The access method is sas token.'
