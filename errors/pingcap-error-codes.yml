error_codes:
- code: 49900001
  http_status: 401
  message: public_key not found
  cause: The public key component of the API key does not exist or was deleted.
  action: Re-create the API key in Organization Settings > API Keys and update the caller.
- code: 49900007
  http_status: 429
  message: The request exceeded the limit of 100 times per apikey per minute.
  cause: More than 100 requests were made with one API key inside a single minute.
  action: Honour X-Ratelimit-Reset and retry; request more quota through PingCAP support.
