  read_only: true
- name: switch_database
  description: Switch to a specific database
  category: schema
  read_only: true
- name: show_tables
  description: Show all tables in the current database
  category: schema
  read_only: true
- name: db_query
  description: Execute read-only SQL queries
  category: sql
  read_only: true
- name: db_execute
  description: Execute SQL statements (DML or DDL)
  category: sql
  read_only: false
