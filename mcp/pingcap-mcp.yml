configuration:
  env:
  - name: TIDB_HOST
    description: TiDB host to connect to
  - name: TIDB_PORT
    description: TiDB port (4000 by default)
  - name: TIDB_USERNAME
    description: SQL user
  - name: TIDB_PASSWORD
    description: SQL user password
  - name: TIDB_DATABASE
    description: Default database
  client_config: mcpServers block in the MCP client configuration file; .env file for SSE mode
tools:
- name: show_databases
