  read_only: false
surface_note: The TiDB MCP Server operates on the SQL data plane (MySQL protocol), not on the TiDB Cloud
  management REST API. Agent-side control-plane work is instead covered by the published tidbcloud-manager
  agent skill, which drives the TiDB Cloud OpenAPI directly.
