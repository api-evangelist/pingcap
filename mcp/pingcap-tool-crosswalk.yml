    - pingcap-tidb-cloud-v1beta-openapi-original.json
    - pingcap-tidb-cloud-zero-v1alpha1-openapi-original.json
    - pingcap-tidb-dm-openapi-original.yaml
    operations: 192
    gated: false
    auth: HTTP Digest with an organization API key
  graphql:
    present: false
  mcp:
    server: tidb-mcp-server
    transport: stdio | sse
    hosted_endpoint: null
    tools_list_gated: n/a — no public remote endpoint; tool list taken from the published docs
    plane: MySQL data plane
  agent_skills:
    files:
    - skills/pingcap-tidbcloud-tidbcloud-manager.md
    - skills/pingcap-tidbcloud-tidb-zero.md
    binds_to: the TiDB Cloud OpenAPI control plane
