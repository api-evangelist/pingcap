generated: '2026-08-02'
method: derived
source: mcp/pingcap-mcp.yml + openapi/*-openapi-original.*
note: 'PingCAP ships an MCP server AND a large OpenAPI surface, but they address DIFFERENT planes. The TiDB MCP
  Server speaks the MySQL data plane (schemas, queries, DML/DDL, SQL users) inside one database; the published OpenAPI
  documents are the TiDB Cloud control plane (clusters, branches, imports, exports, changefeeds, IAM, billing, Data
  Service). There is therefore NO tool-to-operation overlap: every MCP tool is mcp_only and every REST operation
  is rest_only. That divergence is the finding, not a gap to paper over. The bridge PingCAP does publish is the
  tidbcloud-manager agent skill, which drives the control-plane OpenAPI directly rather than through MCP.'
surfaces:
  openapi:
    files:
    - pingcap-ossinsight-public-api-openapi-original.yaml
    - pingcap-tidb-cloud-billing-v1beta1-openapi-original.json
    - pingcap-tidb-cloud-data-service-v1beta1-openapi-original.json
    - pingcap-tidb-cloud-dedicated-v1beta1-openapi-original.json
