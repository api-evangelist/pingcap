- name: TiDB Cloud Zero API (v1alpha1)
  description: Unauthenticated REST API that provisions a disposable, MySQL-compatible TiDB database in a single
    call. Instances auto-expire after 30 days unless claimed into a regular TiDB Cloud Starter instance. Used as
    the zero-friction playground and as the provisioning surface behind the published tidb-cloud-zero agent skill.
  humanURL: https://zero.tidbcloud.com/
  baseURL: https://zero.tidbapi.com/v1alpha1
