aid: pingcap
name: PingCAP
description: PingCAP is the company behind TiDB, an open-source, MySQL-compatible distributed SQL database built
  for hybrid transactional and analytical processing (HTAP), horizontal scale-out, Raft-based strong consistency,
  and vector search for AI workloads. PingCAP operates TiDB Cloud, the fully managed DBaaS delivered in Starter,
  Essential, Premium, Dedicated, BYOC and Lake tiers across AWS, Google Cloud, Azure and Alibaba Cloud. Developers
  manage the platform programmatically through the TiDB Cloud REST API family (cluster, branch, import, export,
  changefeed, IAM, billing and Data Service surfaces), the `ticloud` CLI, a Terraform provider, the TiDB Cloud Serverless
  JavaScript driver, the PyTiDB Python SDK, and an official TiDB MCP Server for agents. PingCAP also publishes OpenAPI
  for the TiDB Data Migration (DM) control plane and the OSS Insight public API.
