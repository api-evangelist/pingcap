- data-migration
- change-data-capture
- open-source
- infrastructure
apis:
- name: TiDB MCP Server
  description: >-
    Official Model Context Protocol server maintained by PingCAP that exposes a TiDB or TiDB Cloud database
    to MCP-capable agents and IDEs. Ships in the pytidb package, runs over stdio by default or SSE with
    --transport sse, and provides schema introspection, read query execution, DML/DDL execution and database
    user management.
  humanURL: https://docs.pingcap.com/ai/tidb-mcp-server/
  baseURL: https://docs.pingcap.com/ai/tidb-mcp-server/
  tags:
  - mcp
  - agent-native
