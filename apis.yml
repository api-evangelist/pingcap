- name: TiDB Data Migration (DM) OpenAPI
  description: OpenAPI 3.0 control-plane API for TiDB Data Migration, the platform that replicates MySQL-compatible
    upstreams into TiDB. Covers upstream source registration, relay log control, migration task lifecycle and status,
    task templates, table-structure operations and DM cluster master/worker membership. Served by dm-master in a
    self-managed DM deployment.
  humanURL: https://docs.pingcap.com/tidb/stable/dm-open-api/
  baseURL: https://docs.pingcap.com/tidb/stable/dm-open-api/
