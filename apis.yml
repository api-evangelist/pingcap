- name: OSS Insight Public API
  description: Public read-only REST API behind OSS Insight, the PingCAP-built open-source analytics service that
    queries billions of GitHub events stored in TiDB. Exposes repository, developer, organization, collection and
    trending analytics endpoints used by the ossinsight.io site and by third parties.
